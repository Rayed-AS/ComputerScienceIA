<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .button {
            background-color: #7ed957;
            padding: 10px 20px;
            border-radius: 4px;
            text-align: center;
            color: #0898af;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0px auto 15px;
        }

        .button:hover{
            background-color: #bfd01a
        }

        .button:active {
            transform: scale(0.95);
        }

        .maincontent{
            padding-top: 50px;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* AI CODE */
        .card {
            display: flex;
            background-color: #82DC55;
            padding: 15px;
            gap: 20px;
            margin-bottom: 10px;
        }

        .card img {
            width: 500px;
            height: auto;
            object-fit: cover;
        }

        /* Image on the left */
        .card-icon {
            width: 100px;
            padding: 100px;
            background-color: grey;
            color: yellow;
            object-fit: cover;
        }

        /* Text & Buttons on the right */
        .card-body {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Pushes text to top, buttons to bottom */
            text-align: center;
            width: 100%;
        }

        /* Row for the buttons */
        .card-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-learn {
            flex: 1;
            background-color: #A3A3A3;
            color: black;
            padding: 8px;
            text-decoration: none;
        }

        .btn-delete {
            flex: 1;
            background-color: #CC0000;
            color: white;
            padding: 8px;
            text-decoration: none;
        }

        .form {
            display: grid;
            grid-template-columns: auto auto auto auto;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .form-container{
            display: flex;
            flex-direction: column;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            list-style-type: none;
            margin: 0;
            padding: 4px;
            background-color: #a5a5a5;
            display: flex;
            justify-content: center;
        }

        .title {
            color: #c6d917;
            text-align: center;
            justify-content: center;
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin: 20px 0 30px 0; /* Adds spacing above and below the search bar */
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 500px; /* Adjusts how wide the search bar can get */
            background-color: #ffffff;
            border: 2px solid #7bc640; /* Uses your theme's green accent color */
            border-radius: 25px;
            padding: 5px 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .search-icon {
            color: #888888;
            margin-right: 10px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 8px 0;
            background: transparent;
        }

        .search-button {
            background-color: #7bc640;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .search-button:hover {
            background-color: #68ab34;
        }
    </style>
</head>
<body>
    <nav class = "navbar">
        <a href = "/view-applications" class = "button" style = "display: inline-block">Applications<i class="fa-solid fa-clipboard-list" style = "margin-left: 10px;"></i></a>
        <a href = "/student-home" class = "button" style = "display: inline-block">Home<i class="fa-solid fa-house" style = "margin-left: 10px;"></i></a>
        <a href = "/view-opportunities" class = "button" style = "display: inline-block">View Opportunities<i class="fa-solid fa-magnifying-glass" style = "margin-left: 10px;"></i></a>
    </nav>
    <div class="search">
        <input type="text" placeholder="Search..">
    </div>
    <div class = "maincontent" >
        {%block content%}
        {%endblock%}
    </div>
</body>
</html>
